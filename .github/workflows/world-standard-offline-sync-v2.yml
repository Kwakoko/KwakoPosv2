name: World-Standard Offline Sync Gate v2

on:
  push:
    branches:
      - main
      - 'fix/offline-sync-*'
      - 'fix/world-standard-offline-sync-*'
  pull_request:
    branches: [main]

jobs:
  offline-sync-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kwakopos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kwakopos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos_ci?schema=public
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run test:sync
      - run: npx playwright install --with-deps chromium
      - run: npm run certify:offline-e2e
      - run: npm run certify:offline-sync
      - name: Upload offline sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-standard-offline-sync-evidence
          path: artifacts/release-evidence/
          if-no-files-found: warn
