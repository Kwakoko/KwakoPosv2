name: Kwakoko Live Production Evidence

on:
  workflow_dispatch:
    inputs:
      execute_production:
        description: Execute real production certification
        required: true
        default: false
        type: boolean

jobs:
  verify-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run production:evidence:verify
      - run: npx vitest run tests/unit/live-production-evidence.test.ts
      - run: npm run build --workspace=@kwakopos2/config
      - run: npm run build --workspace=@kwakopos2/domain

  execute-production-release:
    if: ${{ inputs.execute_production == true }}
    needs: verify-authority
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute real production certification
        env:
          NODE_ENV: production-certification
          EXECUTE_GCLOUD: "true"
        run: npm run production:evidence:execute
