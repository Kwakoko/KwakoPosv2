name: Marketplace Partner Governance
on:
  push:
    paths:
      - 'packages/config/src/marketplacePartnerGovernance.ts'
      - 'packages/contracts/src/marketplaceContracts.ts'
      - 'packages/contracts/src/partnerEcosystemContracts.ts'
      - 'packages/domain/src/marketplaceEngine.ts'
      - 'packages/domain/src/partnerEcosystemEngine.ts'
      - 'scripts/release/verify-marketplace-partner-governance.ts'
      - 'tests/unit/marketplace-partner-governance.test.ts'
  pull_request:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run marketplace-partner:verify
      - run: npx vitest run tests/unit/marketplace-partner-governance.test.ts tests/unit/marketplace.test.ts tests/unit/partner-ecosystem.test.ts
