name: Kwakoko Data Lifecycle & DR Governance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-dr-governance:
    name: Lifecycle / Retention / DR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Data Lifecycle & DR Governance
        run: npm run lifecycle-dr:verify
      - name: Step 13 Contract Tests
        run: npx vitest run tests/unit/data-lifecycle-dr-governance.test.ts tests/unit/privacy-data-governance.test.ts tests/unit/security-trust-governance.test.ts
      - name: Config Build
        run: npm --workspace=@kwakopos2/config run build
