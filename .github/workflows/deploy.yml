name: KwakoPos Continuous Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Deployment Strategy (Canary, BlueGreen, Rolling)'
        required: true
        default: 'Canary'
      target_env:
        description: 'Target Environment (development, staging, preproduction, production)'
        required: true
        default: 'production'

concurrency:
  group: cd-pipeline
  cancel-in-progress: false

jobs:
  deploy-development:
    name: 1. Deploy to Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: echo "Deploying candidate to Development environment..."

  deploy-staging:
    name: 2. Deploy to Staging & Execute Integration Checks
    needs: deploy-development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npx tsx scripts/release/database-migration-gate.ts

  deploy-preproduction:
    name: 3. Deploy to Pre-Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npx tsx scripts/release/verify-kwakopos-modules.ts

  deploy-production:
    name: 4. Production Promotion & Health Verification
    needs: deploy-preproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build

      - name: Run Release Quality Gates
        run: npx tsx scripts/release/quality-gates.ts

      - name: Execute Post-Deployment Health Check
        id: health
        run: npx tsx scripts/release/health-check-gate.ts

      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          npx tsx scripts/release/rollback-engine.ts "$CURRENT_VER" "2.4.0" "Deployment health check failed"

      - name: Publish Official GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/release/publish-github-release.ts
