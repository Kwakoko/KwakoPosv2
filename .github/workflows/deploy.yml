name: KwakoPos Deployment Contract Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Deployment strategy contract check (Canary, BlueGreen, Rolling)'
        required: true
        default: 'Canary'
      target_env:
        description: 'Target environment contract check'
        required: true
        default: 'production'

concurrency:
  group: deployment-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Validate Deployment Contract — No Production Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build candidate
        run: npm run build
      - name: Validate module contract
        run: npx tsx scripts/release/verify-kwakopos-modules.ts
      - name: Validate release quality contract
        run: npx tsx scripts/release/quality-gates.ts
      - name: Assert deployment authority is production release certification pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/production-certification.yml
          test -f .github/workflows/production-release-exact-main.yml
          # PR candidate certification must remain strictly non-mutating.
          ! grep -q "release:deploy-candidate" .github/workflows/production-certification.yml
          ! grep -q "release:promote" .github/workflows/production-certification.yml
          ! grep -q "google-github-actions/auth" .github/workflows/production-certification.yml
          # Exact production release certification is the sole deployment authority.
          grep -q "release:deploy-candidate" .github/workflows/production-release-exact-main.yml
          grep -q "release:promote" .github/workflows/production-release-exact-main.yml
          grep -q "google-github-actions/auth" .github/workflows/production-release-exact-main.yml
          # This contract workflow itself must never mutate main or production infrastructure.
          if grep -q "git push origin HEAD:main" .github/workflows/deploy.yml; then
            echo "DEPLOYMENT_CONTRACT_FAIL: duplicate workflow may mutate main directly."
            exit 1
          fi
          if grep -q "gcloud run deploy" .github/workflows/deploy.yml; then
            echo "DEPLOYMENT_CONTRACT_FAIL: contract workflow may mutate Cloud Run directly."
            exit 1
          fi
          echo "Deployment contract valid: production certification is the only deployment authority."
