name: Kwakoko Platform Governance
on:
  pull_request:
  push:
    branches: [main]

jobs:
  platform-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run platform-governance:verify
      - run: npm exec vitest run tests/unit/platform-governance-control-plane.test.ts tests/unit/platform-governance.test.ts tests/unit/super-admin-platform.test.ts
      - run: npm run build --workspace=packages/config
