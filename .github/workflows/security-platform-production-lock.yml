name: Security Platform Production Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-platform-production-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-platform-lock:
    name: Security Platform Production Lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Execute Security Platform Production Lock
        run: npm run certify:security-lock
