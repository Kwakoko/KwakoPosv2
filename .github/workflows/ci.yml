name: CI Quality Gates

# Closed-loop certification contract: every PR/main candidate must pass all gates.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kwakopos-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates — Build, Test, Integration, Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Database Generation
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit Tests
        run: npm run test:unit
      - name: Integration Tests
        run: npm run test:integration
      - name: Sync Convergence Tests
        run: npm run test:sync
      - name: Version Sync Certification
        run: npm run certify:version-sync
      - name: Report Quality Gate Status
        if: always()
        run: |
          echo "## CI Quality Gates Summary"
          echo "- Node Version: $(node --version)"
          echo "- npm Version: $(npm --version)"
          echo "- Commit Under Test: $(git rev-parse HEAD)"
          echo "- Status: ${{ job.status }}"
