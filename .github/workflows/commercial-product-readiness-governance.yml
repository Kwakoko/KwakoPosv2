name: Kwakoko Commercial Product Readiness Governance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-readiness:
    name: Commercial Product Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Commercial governance verifier
        run: npx tsx scripts/release/verify-commercial-product-readiness.ts
      - name: Commercial readiness certification
        run: npm run certify:commercial-readiness
      - name: Monetization acceptance and invariants
        run: npx vitest run tests/unit/monetization-acceptance.test.ts tests/unit/monetization-invariants.test.ts tests/unit/commercial-product-readiness-governance.test.ts
      - name: Domain build
        run: npm --workspace=@kwakopos2/domain run build
      - name: Config build
        run: npm --workspace=@kwakopos2/config run build
      - name: Required delegated governance
        run: npm run security-trust:verify && npm run privacy-data:verify && npm run lifecycle-dr:verify && npm run ai-governance:verify && npm run workflow:verify
