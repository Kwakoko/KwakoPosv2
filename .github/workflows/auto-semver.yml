name: KwakoPos Automatic SemVer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kwakopos-auto-semver-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-semver:
    name: Calculate, certify and publish next SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Repair npm lockfile drift before release
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "NPM lockfile synchronized in the release workspace."
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build all workspaces
        run: npm run build
      - name: Verify release recovery invariant
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (p.version !== l.version) throw new Error(`VERSION_DRIFT: package.json=${p.version} package-lock.json=${l.version}`);
          const tags = execSync('git tag --merged HEAD --sort=-v:refname', { encoding: 'utf8' }).split(/\r?\n/).map(v => v.trim()).filter(v => /^v\d+\.\d+\.\d+$/.test(v));
          if (!tags.length) throw new Error('RELEASE_RECOVERY_FAIL: no SemVer tag found on current history');
          const latest = tags[0];
          if (p.version === latest.slice(1)) {
            const commits = Number(execSync(`git rev-list ${latest}..HEAD --count`, { encoding: 'utf8' }).trim());
            if (commits > 0) throw new Error(`RELEASE_RECOVERY_FAIL: repository is ahead of ${latest} but package.json remains at ${p.version}`);
          }
          console.log(`RELEASE_RECOVERY_OK: version=${p.version}, latestTag=${latest}`);
          NODE
      - name: Detect release commit state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          version="$(node -p "require('./package.json').version")"
          release_commit=false

          # Direct release commit.
          if [[ "$subject" =~ ^chore\(release\):\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            release_commit=true
          else
            # Release PRs merge as "Merge pull request #N ...". Treat the
            # merge commit as the authoritative release commit when its
            # second parent is the generated chore(release) commit.
            parents="$(git rev-list --parents -n 1 HEAD)"
            if [[ "$(echo "$parents" | awk '{print NF-1}')" -ge 2 ]]; then
              release_parent="$(echo "$parents" | awk '{print $3}')"
              release_subject="$(git log -1 --pretty=%s "$release_parent")"
              if [[ "$release_subject" == "chore(release): v${version}" || "$release_subject" == "chore(release): v${version} "* ]]; then
                release_commit=true
              fi
            fi
          fi

          if [[ "$release_commit" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Release state detected for $GITHUB_SHA: $subject"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate automatic SemVer bump
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx scripts/release/prepare-release.ts
      - name: Resolve authoritative release candidate
        if: steps.guard.outputs.skip != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$LATEST_TAG" != "v${VERSION}" ]]; then
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare protected release branch
        if: steps.guard.outputs.skip != 'true' && steps.candidate.outputs.needs_release == 'true'
        id: commit_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [[ -n "$LATEST_TAG" ]] || { echo "RELEASE_BLOCKED: no authoritative SemVer baseline tag"; exit 1; }
          [[ "$VERSION" != "${LATEST_TAG#v}" ]] || { echo "RELEASE_BLOCKED: release candidate did not advance beyond $LATEST_TAG"; exit 1; }
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "RELEASE_BLOCKED: tag v${VERSION} already exists; refusing duplicate release tag"; exit 1;
          fi
          git config user.name "github-actions[bot]"
          RELEASE_BRANCH="release/v${VERSION}"
          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$OPEN_PR" ]]; then
            REMOTE_RELEASE_SHA="$(git ls-remote --heads origin "$RELEASE_BRANCH" | awk '{print $1}')"
            [[ -n "$REMOTE_RELEASE_SHA" ]] || { echo "RELEASE_BLOCKED: PR #$OPEN_PR exists but release branch $RELEASE_BRANCH is missing"; exit 1; }
            git fetch origin "$RELEASE_BRANCH"
            if git merge-base --is-ancestor "$GITHUB_SHA" "$REMOTE_RELEASE_SHA"; then
              echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
              echo "release_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"
              echo "Release PR #$OPEN_PR already contains current main SHA $GITHUB_SHA; leaving it unchanged."
            else
              echo "STALE_RELEASE_PR: refreshing PR #$OPEN_PR ($RELEASE_BRANCH) onto current main SHA $GITHUB_SHA"
              git switch -C "$RELEASE_BRANCH" "$GITHUB_SHA"
              git add -A
              git commit --allow-empty -m "chore(release): v${VERSION}"
              git push --force-with-lease=refs/heads/"$RELEASE_BRANCH":"$REMOTE_RELEASE_SHA" origin "HEAD:$RELEASE_BRANCH"
              echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
              echo "release_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"
              echo "Release PR #$OPEN_PR refreshed from current main SHA $GITHUB_SHA with release commit $(git rev-parse HEAD)."
            fi
            exit 0
          fi
          # A stale release branch without an open PR is recoverable.
          # Recycle it onto the exact main candidate instead of blocking release automation.
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "STALE_RELEASE_BRANCH: $RELEASE_BRANCH exists without an open release PR; recycling it from $GITHUB_SHA"
            git fetch origin "$RELEASE_BRANCH"
            git switch -C "$RELEASE_BRANCH" "$GITHUB_SHA"
            git add -A
            git commit -m "chore(release): v${VERSION}"
            git push --force-with-lease=refs/heads/"$RELEASE_BRANCH":$(git rev-parse "origin/$RELEASE_BRANCH") origin HEAD:"$RELEASE_BRANCH"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$RELEASE_BRANCH"
            git add -A
            git commit -m "chore(release): v${VERSION}"
            git push origin HEAD:"$RELEASE_BRANCH"
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" --title "chore(release): v${VERSION}" --body "Automated protected release candidate for ${VERSION}. Source main SHA: ${GITHUB_SHA}. Release candidate SHA: ${RELEASE_SHA}. All repository-required gates must pass before merge.")"
          echo "release_pr=$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')" >> "$GITHUB_OUTPUT"
          echo "Release PR opened: $PR_URL"
      - name: Wait for required CI gates before production certification
        if: steps.guard.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.guard.outputs.release_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in ci.yml security-scan.yml; do
            echo "Waiting for $workflow to complete successfully for $RELEASE_SHA"
            passed=false
            for attempt in $(seq 1 90); do
              state="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$RELEASE_SHA" --limit 1 --json status,conclusion --jq 'if length == 0 then "MISSING" elif .[0].status != "completed" then ("RUNNING:" + (.[0].status // "")) else ("COMPLETED:" + (.[0].conclusion // "")) end')"
              echo "[$workflow] attempt $attempt/90 -> $state"
              case "$state" in
                COMPLETED:success)
                  passed=true
                  break
                  ;;
                COMPLETED:*)
                  echo "RELEASE_BLOCKED: $workflow completed unsuccessfully: $state"
                  exit 1
                  ;;
              esac
              sleep 10
            done
            [[ "$passed" == "true" ]] || { echo "RELEASE_BLOCKED: timeout waiting for $workflow to pass for $RELEASE_SHA"; exit 1; }
          done

      - name: Dispatch exact production certification
        if: steps.guard.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.guard.outputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<EOF
          {"event_type":"certify-release","client_payload":{"release_sha":"$RELEASE_SHA"}}
          EOF
          echo "Production certification dispatched for $RELEASE_SHA"

      - name: SemVer Production Lock
        run: npm run certify:semver-lock
