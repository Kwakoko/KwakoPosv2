name: KwakoPos Automatic SemVer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kwakopos-auto-semver-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-semver:
    name: Calculate, certify and publish next SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Repair npm lockfile drift before release
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "NPM lockfile synchronized in the release workspace."
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build all workspaces
        run: npm run build
      - name: Verify release recovery invariant
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (p.version !== l.version) throw new Error(`VERSION_DRIFT: package.json=${p.version} package-lock.json=${l.version}`);
          const tags = execSync('git tag --merged HEAD --sort=-v:refname', { encoding: 'utf8' }).split(/\r?\n/).map(v => v.trim()).filter(v => /^v\d+\.\d+\.\d+$/.test(v));
          if (!tags.length) throw new Error('RELEASE_RECOVERY_FAIL: no SemVer tag found on current history');
          const latest = tags[0];
          if (p.version === latest.slice(1)) {
            const commits = Number(execSync(`git rev-list ${latest}..HEAD --count`, { encoding: 'utf8' }).trim());
            if (commits > 0) throw new Error(`RELEASE_RECOVERY_FAIL: repository is ahead of ${latest} but package.json remains at ${p.version}`);
          }
          console.log(`RELEASE_RECOVERY_OK: version=${p.version}, latestTag=${latest}`);
          NODE
      - name: Skip release commits
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" =~ ^chore\(release\):\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release commit detected: $subject"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate automatic SemVer bump
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx scripts/release/prepare-release.ts
      - name: Resolve authoritative release candidate
        if: steps.guard.outputs.skip != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$LATEST_TAG" != "v${VERSION}" ]]; then
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare protected release branch
        if: steps.guard.outputs.skip != 'true' && steps.candidate.outputs.needs_release == 'true'
        id: commit_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [[ -n "$LATEST_TAG" ]] || { echo "RELEASE_BLOCKED: no authoritative SemVer baseline tag"; exit 1; }
          [[ "$VERSION" != "${LATEST_TAG#v}" ]] || { echo "RELEASE_BLOCKED: release candidate did not advance beyond $LATEST_TAG"; exit 1; }
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "RELEASE_BLOCKED: tag v${VERSION} already exists; refusing duplicate release tag"; exit 1;
          fi
          git config user.name "github-actions[bot]"
          RELEASE_BRANCH="release/v${VERSION}"
          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$OPEN_PR" ]]; then
            echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "release_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"
            echo "Release PR #$OPEN_PR already exists for $RELEASE_BRANCH; leaving it untouched."
            exit 0
          fi
          # A stale release branch without an open PR is recoverable.
          # Recycle it onto the exact main candidate instead of blocking release automation.
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "STALE_RELEASE_BRANCH: $RELEASE_BRANCH exists without an open release PR; recycling it from $GITHUB_SHA"
            git fetch origin "$RELEASE_BRANCH"
            git switch -C "$RELEASE_BRANCH" "$GITHUB_SHA"
            git add -A
            git commit -m "chore(release): v${VERSION}"
            git push --force-with-lease=refs/heads/"$RELEASE_BRANCH":$(git rev-parse "origin/$RELEASE_BRANCH") origin HEAD:"$RELEASE_BRANCH"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$RELEASE_BRANCH"
            git add -A
            git commit -m "chore(release): v${VERSION}"
            git push origin HEAD:"$RELEASE_BRANCH"
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" --title "chore(release): v${VERSION}" --body "Automated protected release candidate for ${VERSION}. Source main SHA: ${GITHUB_SHA}. Release candidate SHA: ${RELEASE_SHA}. All repository-required gates must pass before merge.")"
          echo "release_pr=$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')" >> "$GITHUB_OUTPUT"
          echo "Release PR opened: $PR_URL"
      - name: Dispatch exact production certification
        if: steps.guard.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<EOF
          {"event_type":"certify-release","client_payload":{"release_sha":"$RELEASE_SHA"}}
          EOF
          echo "Production certification dispatched for $RELEASE_SHA"

      - name: Verify authoritative SemVer state
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version) throw new Error('VERSION_DRIFT: package.json='+p.version+' package-lock.json='+l.version); if(!/^\d+\.\d+\.\d+([-.+].*)?$/.test(p.version)) throw new Error('INVALID_SEMVER:'+p.version); console.log('Authoritative SemVer: '+p.version);"
