name: KwakoPos Automatic SemVer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kwakopos-auto-semver-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  auto-semver:
  auto-semver:
    name: Calculate, certify and publish next SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Validate version and lockfile alignment
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (p.version !== l.version || l.packages?.['']?.version !== p.version) {
            throw new Error(`VERSION_DRIFT: package.json=${p.version} package-lock.json=${l.version} rootLock=${l.packages?.['']?.version}`);
          }
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(p.version)) {
            throw new Error(`INVALID_SEMVER: ${p.version}`);
          }
          console.log(`VERSION_OK: ${p.version}`);
          NODE
      - name: Skip release commits
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" =~ ^chore\(release\):\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release commit detected: $subject"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate automatic SemVer bump
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx scripts/release/prepare-release.ts
      - name: Resolve authoritative release candidate
        if: steps.guard.outputs.skip != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$LATEST_TAG" != "v${VERSION}" ]]; then
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare protected release branch
        if: steps.guard.outputs.skip != 'true' && steps.candidate.outputs.needs_release == 'true'
        id: commit_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [[ -n "$LATEST_TAG" ]] || { echo "RELEASE_BLOCKED: no authoritative SemVer baseline tag"; exit 1; }
          [[ "$VERSION" != "${LATEST_TAG#v}" ]] || { echo "RELEASE_BLOCKED: release candidate did not advance beyond $LATEST_TAG"; exit 1; }
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "RELEASE_BLOCKED: tag v${VERSION} already exists; refusing duplicate release tag"; exit 1;
          fi
          git config user.name "github-actions[bot]"
          RELEASE_BRANCH="release/v${VERSION}"
          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$OPEN_PR" ]]; then
            echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect pending release candidate
        id: pending
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          latest="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [[ -n "$latest" ]] || { echo "RELEASE_BLOCKED: no authoritative SemVer baseline tag exists." >&2; exit 1; }
          latest_version="${latest#v}"
          if [[ "$version" != "$latest_version" ]]; then
            highest="$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -n1)"
            if [[ "$highest" == "$version" ]]; then
              echo "pending=true" >> "$GITHUB_OUTPUT"
              echo "RELEASE_CANDIDATE_PENDING: v$version is already committed ahead of $latest; no duplicate release commit will be created."
              exit 0
            fi
            echo "RELEASE_BLOCKED: package version v$version is behind latest release tag $latest." >&2
            exit 1
          fi
          echo "pending=false" >> "$GITHUB_OUTPUT"
      - name: Wait for required mainline checks
        if: steps.guard.outputs.skip != 'true' && steps.pending.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=("CI Quality Gates" "Security & Vulnerability Scanning")
          deadline=$((SECONDS + 1800))
          for workflow in "${workflows[@]}"; do
            while true; do
              result="$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq 'if length == 0 then "" else .[0].status + "|" + (.[0].conclusion // "") end' 2>/dev/null || true)"
              case "$result" in
                completed\|success) break ;;
                completed\|*) echo "RELEASE_BLOCKED: $workflow failed for $GITHUB_SHA ($result)" >&2; exit 1 ;;
                "")
                  if (( SECONDS >= deadline )); then echo "RELEASE_BLOCKED: $workflow did not publish a completed run for $GITHUB_SHA within 30 minutes." >&2; exit 1; fi
                  sleep 10 ;;
                *)
                  if (( SECONDS >= deadline )); then echo "RELEASE_BLOCKED: $workflow remained incomplete for $GITHUB_SHA for 30 minutes." >&2; exit 1; fi
                  sleep 10 ;;
              esac
            done
          done
          echo "Required mainline checks are green for $GITHUB_SHA."
      - name: Calculate automatic SemVer bump
        if: steps.guard.outputs.skip != 'true' && steps.pending.outputs.pending != 'true'
        run: npx tsx scripts/release/prepare-release.ts
      - name: Resolve authoritative release candidate
        if: steps.guard.outputs.skip != 'true' && steps.pending.outputs.pending != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [[ -n "$LATEST_TAG" ]] || { echo "RELEASE_BLOCKED: no authoritative SemVer baseline tag"; exit 1; }
          if [[ "$LATEST_TAG" == "v${VERSION}" ]]; then
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
            echo "No release candidate produced; version remains $VERSION."
          else
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release candidate branch and pull request
        if: steps.candidate.outputs.needs_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [[ -n "$LATEST_TAG" ]] || { echo "RELEASE_BLOCKED: no authoritative SemVer baseline tag" >&2; exit 1; }
          [[ "$VERSION" != "${LATEST_TAG#v}" ]] || { echo "RELEASE_BLOCKED: candidate did not advance beyond $LATEST_TAG" >&2; exit 1; }
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "RELEASE_BLOCKED: tag v${VERSION} already exists; refusing duplicate release tag" >&2
            exit 1
          fi
          RELEASE_BRANCH="automation/release-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          LOCAL_SHA="$(git rev-parse HEAD)"
          EXISTING_SHA="$(git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ -n "$EXISTING_SHA" && "$EXISTING_SHA" != "$LOCAL_SHA" ]]; then
            echo "RELEASE_BLOCKED: existing release branch ${RELEASE_BRANCH} points to ${EXISTING_SHA}, expected ${LOCAL_SHA}." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --title "chore(release): v${VERSION}" --body "Automated SemVer release candidate v${VERSION}. This PR must pass all required checks before merge; production certification runs against the exact merged main SHA." --json number --jq .number)"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Release candidate v${VERSION} prepared from ${LOCAL_SHA}. Certification will be dispatched only after the merged main SHA is known." || true
          echo "RELEASE_PR_CREATED: #${PR_NUMBER} ${RELEASE_BRANCH} @ ${LOCAL_SHA}"
      - name: Certify existing merged release candidate
        if: steps.pending.outputs.pending == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          existing="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "KwakoPos Exact Main Production Certification" --branch main --limit 20 --json headSha,status --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .headSha" | head -n1)"
          if [[ "$existing" == "$GITHUB_SHA" ]]; then
            echo "RELEASE_CERTIFICATION_ALREADY_DISPATCHED: v${VERSION} @ ${GITHUB_SHA}"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<EOF
          {"event_type":"certify-release","client_payload":{"release_sha":"$GITHUB_SHA"}}
          EOF
          echo "RELEASE_CERTIFICATION_DISPATCHED: v${VERSION} @ ${GITHUB_SHA}"
      - name: Verify authoritative SemVer state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=require('./package.json');
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (p.version !== l.version || l.packages?.['']?.version !== p.version) throw new Error(`VERSION_DRIFT: ${p.version}`);
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(p.version)) throw new Error(`INVALID_SEMVER: ${p.version}`);
          console.log(`Authoritative SemVer: ${p.version}`);
          NODE