name: Kwakoko Brand Asset Lock
on:
  pull_request:
  push:
    branches: [main, work/kwakopos-decomposition-2026-09-07]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/release/verify-brand-asset-lock.ts
      - run: npx vitest run tests/unit/brand-asset-lock.test.ts
      - run: npm run build --workspace=@kwakopos2/config
