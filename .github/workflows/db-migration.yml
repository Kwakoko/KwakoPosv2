name: Database Migration Management

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (true/false)'
        required: false
        default: 'true'
        type: string

concurrency:
  group: database-migration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database-migration:
    name: Validate Database Migration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run migration safety gate
        run: npx tsx scripts/release/database-migration-gate.ts
