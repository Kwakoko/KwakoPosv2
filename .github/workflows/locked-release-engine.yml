name: KwakoPos Locked Automated Release Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      emergency_release:
        description: 'Trigger controlled emergency production release (true/false)'
        required: false
        default: 'false'
        type: boolean
      incident_id:
        description: 'Incident ID if emergency release'
        required: false
        type: string

concurrency:
  group: locked-release-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read
  id-token: write

jobs:
  locked-release-engine:
    name: Integrity → Build → Test → Security → SemVer → Tag → GitHub Release
    runs-on: ubuntu-latest
    environment: production-release

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Enforce Protected Production Branch Policy
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          echo "RELEASE_BLOCKED: Production releases can only originate from main branch."
          exit 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate A — Tamper Detection & Control File Integrity
        run: npx tsx scripts/release/tamper-detector.ts

      - name: Gate B — Clean Monorepo Build Verification
        run: |
          npm run db:generate
          npm run build

      - name: Gate C — Automated Test Suite Verification
        run: |
          npm run test:unit
          npm run test:integration
          npm run test:sync

      - name: Gate D — Security & Vulnerability Certification Gate
        run: npm run certify:security

      - name: Gate E — Database & Prisma Schema Consistency Gate
        run: npx tsx scripts/release/database-migration-gate.ts

      - name: Gate F — 17-Domain Platform Certification Gate
        run: npm run certify:campaign

      - name: Evaluate Release Candidate Approval Determination
        run: npx tsx scripts/release/release-candidate-engine.ts

      - name: Zero-Manual Versioning — Calculate Next Semantic Version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx tsx scripts/release/semver-calculator.ts

      - name: Publish Official Immutable Tag & GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/release/publish-github-release.ts

      - name: Execute Emergency Release Path (If Authorized)
        if: inputs.emergency_release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCIDENT_ID: ${{ inputs.incident_id || 'INC-EMERGENCY' }}
          EMERGENCY_AUTHORIZER: ${{ github.actor }}
        run: npx tsx scripts/release/emergency-release.ts

      - name: Archive Permanent Release Evidence & SLSA Provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-release-engine-evidence-${{ github.sha }}
          path: artifacts/release-evidence/
          retention-days: 90
          if-no-files-found: warn
