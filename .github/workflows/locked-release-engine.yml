name: KwakoPos Locked Release Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: locked-release-integrity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  locked-release-integrity:
    name: Integrity → Build → Test → Security → Version Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production Navigation Lock — route/submenu contract
        run: npm run certify:navigation-lock
      - name: Gate A — Tamper Detection & Control File Integrity
        run: npx tsx scripts/release/tamper-detector.ts
      - name: Gate B — Clean Monorepo Build Verification
        run: |
          npm run db:generate
          npm run build
      - name: Gate C — Automated Test Suite Verification
        run: |
          npm run test:unit
          npm run test:integration
          npm run test:sync
      - name: Gate D — Security Certification
        run: npm run certify:security
      - name: Gate E — Database Migration Contract
        run: npx tsx scripts/release/database-migration-gate.ts
      - name: Gate G — Release Candidate Approval Determination
        run: npx tsx scripts/release/release-candidate-engine.ts
      - name: Gate H — Assert no release mutation is performed here
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "git push origin" .github/workflows/locked-release-engine.yml
          ! grep -q "publish-github-release" .github/workflows/locked-release-engine.yml
          echo "Locked release integrity gate is non-mutating; production release authority remains separate."
      - name: Archive release integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-locked-release-integrity-${{ github.sha }}
          path: artifacts/release-evidence/
          retention-days: 90
          if-no-files-found: warn
