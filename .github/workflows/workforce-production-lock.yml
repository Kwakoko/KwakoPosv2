name: Workforce Production Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workforce-lock:
    name: Staff / HR Production Lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kwakopos_workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kwakopos_workforce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos_workforce_ci?schema=public
      CI: true
      NODE_ENV: test
      KWAKOPOS_TEST_BYPASS_LEGAL_GATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:migrate
      - name: Build workspaces
        run: npm run build
      - name: Staff / HR production lock
        run: npx tsx scripts/certification/workforce-production-lock.ts
      - name: Workforce API and payroll tests
        run: npx vitest run tests/integration/workforce-api.test.ts tests/unit/workforce.test.ts tests/unit/commissions-payroll.test.ts --reporter=verbose
