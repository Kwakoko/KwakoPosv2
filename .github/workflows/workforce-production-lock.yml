name: Workforce Production Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workforce-lock:
    name: Staff / HR Production Lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build workspaces
        run: npm run build
      - name: Staff / HR production lock
        run: npm run certify:workforce-lock
      - name: Workforce API and payroll tests
        run: npx vitest run tests/integration/workforce-api.test.ts tests/unit/workforce.test.ts tests/unit/commissions-payroll.test.ts --reporter=verbose
