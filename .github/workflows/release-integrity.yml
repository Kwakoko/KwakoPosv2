name: KwakoPos Release Integrity Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-integrity:
    name: Release Integrity Lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify committed dependency graph is reproducible
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          diff -u /tmp/package-lock.before.json package-lock.json
          npm ci
          diff -u /tmp/package-lock.before.json package-lock.json
          echo "LOCKFILE_OK: committed package-lock.json is reproducible and npm ci leaves it unchanged."

      - name: Verify package and lock versions are identical
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rootLock = lock.packages?.['']?.version;
          if (!pkg.version || !lock.version || !rootLock) throw new Error('VERSION_METADATA_MISSING');
          if (pkg.version !== lock.version || pkg.version !== rootLock) {
            throw new Error(`VERSION_DRIFT: package=${pkg.version} lock=${lock.version} root-lock=${rootLock}`);
          }
          if (!/^\d+\.\d+\.\d+([-.+].*)?$/.test(pkg.version)) throw new Error(`INVALID_SEMVER: ${pkg.version}`);
          console.log(`VERSION_OK: ${pkg.version}`);
          NODE

      - name: Verify SemVer cannot regress below latest tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No authoritative SemVer tag found; regression check skipped."
            exit 0
          fi
          node - "$VERSION" "${LATEST_TAG#v}" <<'NODE'
          const [current, baseline] = process.argv.slice(2);
          const parse = value => value.split('.').map(Number);
          const rank = value => { const [a,b,c] = parse(value); return a * 1000000 + b * 1000 + c; };
          if (rank(current) < rank(baseline)) {
            throw new Error(`VERSION_REGRESSION: package.json=${current} latest_tag=${baseline}`);
          }
          console.log(`SEMVER_MONOTONIC: ${current} >= ${baseline}`);
          NODE

      - name: Verify release authority remains centralized
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/auto-semver.yml
          test -f .github/workflows/production-release-certification.yml
          grep -q "Dispatch exact production certification" .github/workflows/auto-semver.yml
          grep -q "Commit and tag release candidate" .github/workflows/auto-semver.yml
          echo "RELEASE_AUTHORITY_OK"
