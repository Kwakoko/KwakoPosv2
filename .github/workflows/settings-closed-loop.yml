name: Settings P0/P1 Closed Loop

on:
  push:
    branches:
      - main
      - 'fix/settings-*'
  pull_request:
    branches: [main]

jobs:
  settings-closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kwakopos_settings_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kwakopos_settings_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos_settings_ci?schema=public
      CI: true
      NODE_ENV: test
      KWAKOPOS_TEST_BYPASS_LEGAL_GATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:migrate
      - name: Build workspaces
        run: npm run build
      - name: Run Settings authority certification
        run: npx vitest run tests/integration/settings-closed-loop.test.ts --reporter=verbose
