name: Kwakoko Production Release Authority
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/config/src/productionReleaseAuthority.ts'
      - 'packages/domain/src/productionReleaseAuthorityEngine.ts'
      - 'scripts/release/verify-production-release-authority.ts'
      - 'scripts/release/promote-revision.ts'
      - 'tests/unit/production-release-authority.test.ts'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run production-release:verify
      - run: npx vitest run tests/unit/production-release-authority.test.ts
      - run: npm run build --workspace @kwakopos2/config
