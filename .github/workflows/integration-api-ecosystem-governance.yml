name: Kwakoko Integration API Ecosystem Governance
on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration-api-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run integration-api:verify
      - run: npx vitest run tests/unit/integration-api-ecosystem-governance.test.ts tests/unit/integration.test.ts
      - run: npm run certify:integration
