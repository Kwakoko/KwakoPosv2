name: AI Operating Layer Governance
on:
  push:
  pull_request:

jobs:
  ai-operating-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ai-operating:verify
      - run: npm run config:build --if-present
      - run: npm run test:unit -- --run tests/unit/ai-operating-layer-governance.test.ts tests/unit/ai-operating-layer.test.ts
