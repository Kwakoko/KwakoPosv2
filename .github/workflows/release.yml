name: KwakoPos Release Contract Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Expected release bump contract (optional: patch|minor|major)'
        required: false
        default: ''

concurrency:
  group: release-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-contract:
    name: Certify Release Contract — No Tag/Release Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Validate Conventional Commit / SemVer Contract
        run: npx tsx scripts/release/validate-semver.ts
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build All Monorepo Workspaces
        run: npm run build
      - name: Run Unit and Invariant Tests
        run: npm run test:unit
      - name: Audit Version Alignment
        run: npx tsx scripts/release/certify-version-sync.ts
      - name: Generate Release Notes Contract Evidence
        run: npx tsx scripts/release/generate-release-notes.ts
      - name: Assert release authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/auto-semver.yml
          test -f .github/workflows/production-release-certification.yml
          ! grep -q "softprops/action-gh-release" .github/workflows/release.yml
          echo "Release contract valid: version automation and exact production certification remain authoritative."
