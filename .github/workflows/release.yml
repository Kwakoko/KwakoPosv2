name: KwakoPos Automated Release & Semantic Versioning Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Explicit release bump override (optional: patch|minor|major)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Certify, Tag, and Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Conventional Commits
        run: npx tsx scripts/release/validate-semver.ts

      - name: Generate Prisma Engine
        run: npm run db:generate || echo "Skipping db:generate"

      - name: Build All Monorepo Workspaces
        run: npm run build

      - name: Run Complete Quality & System Certification
        run: npm run test:unit

      - name: Synchronize Workspace Versions
        run: |
          npx tsx scripts/release/sync-workspace-versions.ts

      - name: Audit & Certify Workspace Version Alignment
        run: |
          npx tsx scripts/release/certify-version-sync.ts

      - name: Generate Automated Release Notes & Changelog
        run: |
          npx tsx scripts/release/generate-release-notes.ts

      - name: Read Current Version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.pkg.outputs.version }}"
          name: "KwakoPos Enterprise Release v${{ steps.pkg.outputs.version }}"
          body_path: artifacts/release-evidence/RELEASE_NOTES.md
          files: |
            artifacts/release-evidence/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
