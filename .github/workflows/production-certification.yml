name: KwakoPos 2.0 Real Production Certification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  production-certification:
    name: Production Release Certification State Machine
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Execute Core Unit & Invariant Tests
        run: npm run test:unit

      - name: Execute Integration API Tests
        run: npm run test:integration

      - name: Execute Multi-Device Sync Convergence Tests
        run: npm run test:sync

      - name: Validate Google Cloud Release Configuration
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${GCP_PROJECT_ID}" ]]; then
            echo "RELEASE_BLOCKED: GCP_PROJECT_ID is not configured as a repository secret or variable."
            exit 1
          fi
          if [[ -z "${GCP_WIF_PROVIDER}" || -z "${GCP_SERVICE_ACCOUNT}" ]]; then
            echo "RELEASE_BLOCKED: Google Workload Identity Federation is not configured."
            echo "Required: GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT."
            exit 1
          fi
          echo "Google Cloud WIF configuration is present."

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud Authentication and Project Access
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q . || {
            echo "RELEASE_BLOCKED: No active Google Cloud credential after authentication."
            exit 1
          }
          gcloud config set project "${GCP_PROJECT_ID}"
          gcloud projects describe "${GCP_PROJECT_ID}" --format='value(projectId)' | grep -Fxq "${GCP_PROJECT_ID}" || {
            echo "RELEASE_BLOCKED: Authenticated account cannot access project ${GCP_PROJECT_ID}."
            exit 1
          }
          echo "Google Cloud authentication and project access verified."

      - name: Install Chromium for Real Production Browser Certification
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run production:browser:install

      - name: Deploy Immutable Cloud Run Candidate — 0% Traffic
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NODE_ENV: production-certification
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: kwakopos-production-service
          EXECUTE_GCLOUD: 'true'
        run: npm run release:deploy-candidate

      - name: Export Exact Candidate Identity
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/release-evidence/kwakopos-candidate-deployment.json';
          if (!fs.existsSync(p)) throw new Error('RELEASE_BLOCKED: candidate deployment evidence was not generated');
          const candidate = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!candidate.candidateUrl || !candidate.candidateRevision) {
            throw new Error('RELEASE_BLOCKED: candidate identity missing');
          }
          if (!/^https:\/\//i.test(candidate.candidateUrl) || /localhost|127\.0\.0\.1/i.test(candidate.candidateUrl)) {
            throw new Error(`RELEASE_BLOCKED: invalid candidate URL ${candidate.candidateUrl}`);
          }
          if (!/^sha256:[0-9a-f]{64}$/i.test(candidate.containerDigest)) {
            throw new Error(`RELEASE_BLOCKED: candidate container digest is not immutable: ${candidate.containerDigest}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `CANDIDATE_URL=${candidate.candidateUrl}\nCLOUD_RUN_REVISION=${candidate.candidateRevision}\nCANDIDATE_DIGEST=${candidate.containerDigest}\n`);
          NODE

      - name: Certify Exact Deployed Candidate over HTTPS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npm run production:certify:deployed

      - name: Run Real Chromium Browser A → Cloud Run → Browser B Certification
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npm run production:browser

      - name: Promote Exact Certified Revision to 100% Traffic
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: kwakopos-production-service
          EXECUTE_GCLOUD: 'true'
        run: npm run release:promote

      - name: Archive Production Release Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-release-evidence-${{ github.sha }}
          path: artifacts/release-evidence/
          retention-days: 90
