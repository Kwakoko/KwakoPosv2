name: KwakoPos 2.0 Real Production Certification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: kwakopos-production-certification-main
  cancel-in-progress: false

jobs:
  production-certification:
    name: Production Release Certification State Machine
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify NPM Lockfile Is Deterministic
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "RELEASE_BLOCKED: package-lock.json is out of sync with package.json. Regenerate and commit the lockfile before merging."
            exit 1
          }

      - name: Install Dependencies
        run: npm ci

      - name: Validate Conventional Commit Format
        run: npx tsx scripts/ci/validate-commit-message.ts

      - name: Generate SemVer Release Manifest
        run: npx tsx scripts/release/generate-release-manifest.ts

      - name: Validate Version Consistency Gate
        run: npx tsx scripts/release/version-consistency-gate.ts

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build All Monorepo Workspaces
        run: npm run build

      - name: Execute Core Unit & Invariant Tests (including Finance-001 to Finance-018)
        run: npm run test:unit

      - name: Execute Integration API Tests
        run: npm run test:integration

      - name: Execute Multi-Device Sync Convergence Tests
        run: npm run test:sync

      - name: Execute Continuous Synthetic Monitoring Suite
        run: npx tsx scripts/ops/synthetic-monitor.ts

      - name: Execute Multi-Phase Foundation Certification Runner
        run: npm run certify

      - name: Execute 17-Domain Full-System Certification Campaign
        run: npm run certify:campaign

      - name: Execute Phase 12 Security & Compliance Certification Engine
        run: npm run certify:security

      # Pull requests must never authenticate to GCP, deploy, promote, or mutate production.
      # Real release certification is reserved for release commits on main and manual dispatches.
      - name: Validate Google Cloud Release Configuration
        if: github.event_name != 'pull_request'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ -n "${GCP_PROJECT_ID}" ]] || { echo "RELEASE_BLOCKED: GCP project is not configured."; exit 1; }
          [[ -n "${GCP_WIF_PROVIDER}" && -n "${GCP_SERVICE_ACCOUNT}" ]] || { echo "RELEASE_BLOCKED: Google Workload Identity Federation is not configured."; exit 1; }
          echo "Google Cloud WIF configuration is present."

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud Authentication and Project Access
        if: github.event_name != 'pull_request'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q . || { echo "RELEASE_BLOCKED: no active Google credential"; exit 1; }
          for attempt in 1 2 3 4 5; do
            if gcloud config set project "${GCP_PROJECT_ID}" >/tmp/gcloud-project.out 2>/tmp/gcloud-project.err && \
               gcloud projects describe "${GCP_PROJECT_ID}" --format='value(projectId)' >/tmp/gcloud-describe.out 2>/tmp/gcloud-describe.err && \
               grep -Fxq "${GCP_PROJECT_ID}" /tmp/gcloud-describe.out; then
              echo "Google Cloud authentication and project access verified."
              exit 0
            fi
            echo "[RETRY] Google Cloud credential/project verification attempt ${attempt}/5 failed."
            cat /tmp/gcloud-project.err || true
            cat /tmp/gcloud-describe.err || true
            sleep $((attempt * 5))
          done
          echo "RELEASE_BLOCKED: Google Cloud authentication/project access could not be verified after retries."
          exit 1

      - name: Configure Docker Authentication for Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install Chromium for Real Production Browser Certification
        if: github.event_name != 'pull_request'
        run: npm run production:browser:install

      - name: Apply Versioned Production Database Migrations
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy Immutable Cloud Run Candidate — 0% Traffic
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: production-certification
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: kwakopos-production-service
          EXECUTE_GCLOUD: 'true'
        run: npm run release:deploy-candidate

      - name: Export Exact Candidate Identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/release-evidence/kwakopos-candidate-deployment.json';
          if (!fs.existsSync(p)) { console.log('Candidate deployment evidence missing, halting pipeline'); process.exit(1); }
          const candidate = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!candidate.candidateUrl || !candidate.candidateRevision) { console.log('Candidate identity incomplete, halting pipeline'); process.exit(1); }
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `CANDIDATE_URL=${candidate.candidateUrl}`,
            `CLOUD_RUN_REVISION=${candidate.candidateRevision}`,
            `CONTAINER_DIGEST=${candidate.containerDigest}`,
            `CANDIDATE_DIGEST=${candidate.containerDigest}`,
            `GIT_SHA=${candidate.gitSha}`,
          ].join('\n') + '\n');
          NODE

      - name: Certify Exact Deployed Candidate over HTTPS
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npm run production:certify:deployed

      - name: Run Real Chromium Browser A → Cloud Run → Browser B Certification
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npm run production:browser

      - name: Promote Exact Certified Revision to 100% Traffic
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: kwakopos-production-service
          EXECUTE_GCLOUD: 'true'
        run: npm run release:promote

      - name: Publish Official GitHub Release and Immutable Git Tag
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/release/publish-github-release.ts

      - name: Execute Continuous Production Operations & Governance Gate
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npx tsx scripts/ops/production-operations-gate.ts

      - name: Archive Production Release Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-release-evidence-${{ github.sha }}
          path: artifacts/release-evidence/
          retention-days: 90
          if-no-files-found: warn
