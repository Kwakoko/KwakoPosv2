name: KwakoPos Production Candidate Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kwakopos-production-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-candidate-certification:
    name: Candidate → Build → Tests → Certification — No Production Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kwakopos_candidate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kwakopos_candidate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos_candidate_ci?schema=public
      CI: true
      NODE_ENV: test
      KWAKOPOS_TEST_BYPASS_LEGAL_GATE: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify deterministic lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production Navigation Lock — route/submenu contract
        run: npm run certify:navigation-lock
      - name: Reports Production Lock
        run: npm run certify:reports
      - name: Production Dashboard Analytics Lock
        run: npm run certify:dashboard-lock
      - name: Conflict Center Production Lock
        run: npx tsx scripts/certification/conflict-center-production-lock.ts
      - name: Inventory Production Lock v1
        run: npm run certify:inventory-lock
      - name: Sales Production Lock v1
        run: npm run certify:sales-lock
      - name: Pricing / Promotions Production Lock
        run: npm run certify:pricing-lock
      - name: Receipt Store Production Lock v1
        run: npm run certify:receipts-lock
      - name: Cash Management Production Lock v1
        run: npm run certify:cash-lock
      - name: Finance / Accounting Production Lock v1
        run: npm run certify:finance-lock
      - name: Receivables Audit Production Lock
        run: npm run certify:receivables-lock
      - name: Accounts Payable Audit Production Lock
        run: npm run certify:payables-lock
      - name: Expenses Production Lock
        run: npm run certify:expenses-lock
      - name: Payments Audit Controls Production Lock
        run: npm run certify:payments-lock
      - name: Backdated Inventory Production Lock
        run: npm run certify:backdated-lock
      - name: Validate commit contract
        run: npx tsx scripts/ci/validate-commit-message.ts
      - name: Generate release manifest
        run: npx tsx scripts/release/generate-release-manifest.ts
      - name: Validate version consistency
        run: npx tsx scripts/release/version-consistency-gate.ts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Build all workspaces
        run: npm run build
      - name: Run unit and invariant tests
        run: npm run test:unit
      - name: Run integration API tests
        run: npm run test:integration
      - name: Run multi-device sync convergence tests
        run: npm run test:sync
      - name: Start local API for synthetic and security acceptance tests
        shell: bash
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          JWT_SECRET: "ci-security-local-only-not-for-production"
          START_SERVER: "true"
          SYNC_CERTIFICATION_PRISMA: "true"
        run: |
          set -euo pipefail
          if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
            exit 0
          fi
          nohup npx tsx apps/api/src/server.ts > /tmp/kwakopos-candidate-security-api.log 2>&1 &
          echo $! > /tmp/kwakopos-candidate-security-api.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kwakopos-candidate-security-api.log
          exit 1
      - name: Run synthetic monitoring
        run: npx tsx scripts/ops/synthetic-monitor.ts
      - name: Run foundation certification
        run: npm run certify
      - name: Run full-system certification campaign
        run: npm run certify:campaign
      - name: Start local API for executable security acceptance tests
        shell: bash
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          JWT_SECRET: "ci-security-local-only-not-for-production"
          START_SERVER: "true"
          SYNC_CERTIFICATION_PRISMA: "true"
        run: |
          set -euo pipefail
          if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
            exit 0
          fi
          nohup npx tsx apps/api/src/server.ts > /tmp/kwakopos-candidate-security-api.log 2>&1 &
          echo $! > /tmp/kwakopos-candidate-security-api.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kwakopos-candidate-security-api.log
          exit 1
      - name: Run security certification
        env:
          KWAKOPOS_SECURITY_TARGET_URL: "http://127.0.0.1:3000"
        run: npm run certify:security
      - name: Stop local API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/kwakopos-candidate-security-api.pid ]]; then
            kill "$(cat /tmp/kwakopos-candidate-security-api.pid)" 2>/dev/null || true
          fi
          pkill -P "$(cat /tmp/kwakopos-candidate-security-api.pid 2>/dev/null)" 2>/dev/null || true
      - name: Assert production mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "google-github-actions/auth" .github/workflows/production-certification.yml
          ! grep -q "release:deploy-candidate" .github/workflows/production-certification.yml
          ! grep -q "release:promote" .github/workflows/production-certification.yml
          ! grep -q "publish-github-release" .github/workflows/production-certification.yml
          echo "PR candidate certification is strictly non-mutating."
