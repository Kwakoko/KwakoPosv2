name: KwakoPos Exact Main Production Certification
# Exact production release certification is dispatched explicitly with the exact release SHA; manual dispatch is retained for controlled recovery.

on:
  repository_dispatch:
    types: [certify-release]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Git SHA to certify and deploy
        required: false
        type: string

concurrency:
  group: kwakopos-production-release-certification
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read
  id-token: write

jobs:
  production-release-certification:
    name: Exact Release → Build → Tests → DB → HTTPS → Browser A/B → Promotion → Governance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kwakopos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kwakopos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kwakopos_ci?schema=public
      CI: true
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "RELEASE_BLOCKED: release_sha is not a 40-character Git SHA"; exit 1; }
          [[ "$expected" == "$actual" ]] || { echo "RELEASE_BLOCKED: checkout SHA mismatch: expected=$expected actual=$actual"; exit 1; }
          echo "Exact release SHA verified: $actual"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Mark certification started
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_URL" --repo "$GITHUB_REPOSITORY" --body "Production certification STARTED for exact SHA \`$GITHUB_SHA\`."

      - name: Install dependencies
        run: npm ci

      - name: Foundation Production Lock A01-A12
        run: npm run certify:foundation
      - name: Super Admin Production Lock
        run: npm run certify:super-admin
      - name: Security Platform Production Lock
        run: npm run certify:security-platform-lock
      - name: Platform Services C01-C11 Production Lock
        run: npm run certify:platform-services-lock

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Production Auth Transport Lock
        run: npm run release:auth-lock

      - name: Production Navigation Lock — route/submenu contract
        run: npm run certify:navigation-lock
      - name: Reports Production Lock
        run: npm run certify:reports
      - name: Production Dashboard Analytics Lock
        run: npm run certify:dashboard-lock
      - name: Conflict Center Production Lock
        run: npx tsx scripts/certification/conflict-center-production-lock.ts

      - name: Inventory Production Lock v1
        run: npm run certify:inventory-lock
      - name: Administration Production Lock
        run: npm run certify:administration-lock
      - name: Sales Production Lock v1
        run: npm run certify:sales-lock
      - name: Pricing / Promotions Production Lock
        run: npm run certify:pricing-lock
      - name: Receipt Store Production Lock v1
        run: npm run certify:receipts-lock
      - name: Notifications Production Lock v1
        run: npm run certify:notifications-lock
      - name: Cash Management Production Lock v1
        run: npm run certify:cash-lock
      - name: Finance / Accounting Production Lock v1
        run: npm run certify:finance-lock
      - name: Tax / Fiscalization Production Lock v1
        run: npm run certify:tax-fiscal-lock
      - name: Backdated Inventory Production Lock
        run: npm run certify:backdated-lock
      - name: Offline Sync Platform Production Lock
        run: npm run certify:offline-sync-lock
      - name: Support Production Lock v1
        run: npm run certify:support-lock

      - name: Validate conventional commit
        run: npx tsx scripts/ci/validate-commit-message.ts

      - name: Generate release manifest
        run: npx tsx scripts/release/generate-release-manifest.ts

      - name: Validate version consistency
        run: npx tsx scripts/release/version-consistency-gate.ts
      - name: SemVer Production Lock
        run: npm run certify:semver-lock

      - name: Build all workspaces
        run: npm run build

      - name: Prepare candidate test database
        run: npm run db:migrate

      - name: Run unit and invariant tests
        run: npm run test:unit

      - name: Run integration API tests
        run: npm run test:integration

      - name: Run multi-device sync convergence tests
        run: npm run test:sync

      - name: Execute 17-Domain Full-System Certification Campaign
        run: npm run certify:campaign

      - name: Start local API for executable security acceptance tests
        shell: bash
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          JWT_SECRET: "ci-security-local-only-not-for-production"
          START_SERVER: "true"
          SYNC_CERTIFICATION_PRISMA: "true"
        run: |
          set -euo pipefail
          if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
            exit 0
          fi
          nohup npx tsx apps/api/src/server.ts > /tmp/kwakopos-exact-security-api.log 2>&1 &
          echo $! > /tmp/kwakopos-exact-security-api.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kwakopos-exact-security-api.log
          exit 1

      - name: Execute Phase 12 Security & Compliance Certification Engine
        env:
          KWAKOPOS_SECURITY_TARGET_URL: "http://127.0.0.1:3000"
        run: npm run certify:security

      - name: Stop local security API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/kwakopos-exact-security-api.pid ]]; then
            kill "$(cat /tmp/kwakopos-exact-security-api.pid)" 2>/dev/null || true
            pkill -P "$(cat /tmp/kwakopos-exact-security-api.pid 2>/dev/null)" 2>/dev/null || true
          fi

      - name: Run synthetic monitoring
        run: npx tsx scripts/ops/synthetic-monitor.ts

      - name: Validate Google Cloud configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ -n "$GCP_PROJECT_ID" ]] || { echo "RELEASE_BLOCKED: GCP project missing"; exit 1; }
          [[ -n "$GCP_WIF_PROVIDER" && -n "$GCP_SERVICE_ACCOUNT" ]] || { echo "RELEASE_BLOCKED: GCP WIF configuration missing"; exit 1; }

      - name: Normalize Google Workload Identity Provider
        id: normalize-gcp-wif
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          provider="$GCP_WIF_PROVIDER"
          # Normalize harmless transport/whitespace wrappers without weakening
          # the canonical Google WIF resource-name requirement.
          provider="$(printf '%s' "$provider" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s#^https?://iam.googleapis.com/##; s#^//iam.googleapis.com/##; s#^iam.googleapis.com/##; s#/$##')"
          [[ "$provider" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || {
            echo "RELEASE_BLOCKED: GCP_WORKLOAD_IDENTITY_PROVIDER must be a full projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider> resource name after safe normalization"
            exit 1
          }
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.normalize-gcp-wif.outputs.provider }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud access
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectId)' | grep -Fx "$GCP_PROJECT_ID"

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install Chromium
        run: npm run production:browser:install

      - name: Synchronize production database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy immutable Cloud Run candidate at 0 percent traffic
        env:
          NODE_ENV: production-certification
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: kwakopos-production-service
          EXECUTE_GCLOUD: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run release:deploy-candidate

      - name: Export and validate exact candidate identity
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/release-evidence/kwakopos-candidate-deployment.json';
          const expected = process.env.RELEASE_SHA;
          if (!fs.existsSync(p)) { console.error('RELEASE_BLOCKED: Candidate deployment evidence file missing'); process.exit(1); }
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!c.candidateUrl || !c.candidateRevision || !c.gitSha || !c.containerDigest || !c.imageRef || !c.containerSourceSha) { console.error('RELEASE_BLOCKED: Candidate identity/provenance incomplete'); process.exit(1); }
          if (!/^[0-9a-f]{40}$/.test(c.gitSha) || c.gitSha !== expected) { console.error(`RELEASE_BLOCKED: Candidate source SHA mismatch: expected=${expected} actual=${c.gitSha}`); process.exit(1); }
          if (!/^sha256:[0-9a-f]{64}$/.test(c.containerDigest)) { console.error('RELEASE_BLOCKED: Candidate container digest is missing or invalid'); process.exit(1); }
          if (!c.imageRef.endsWith(`@${c.containerDigest}`)) { console.error('RELEASE_BLOCKED: Candidate image reference does not bind to immutable digest'); process.exit(1); }
          if (!/^[0-9a-f]{40}$/.test(c.containerSourceSha) || c.containerSourceSha !== expected) { console.error(`RELEASE_BLOCKED: Candidate container source SHA mismatch: expected=${expected} actual=${c.containerSourceSha}`); process.exit(1); }
          fs.appendFileSync(process.env.GITHUB_ENV, `CANDIDATE_URL=${c.candidateUrl}\nCLOUD_RUN_REVISION=${c.candidateRevision}\nCONTAINER_DIGEST=${c.containerDigest}\nCANDIDATE_DIGEST=${c.containerDigest}\nGIT_SHA=${c.gitSha}\nCANDIDATE_IMAGE_REF=${c.imageRef}\n`);
          NODE

      - name: Independently verify container OCI source provenance
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}
          CANDIDATE_IMAGE_REF: ${{ env.CANDIDATE_IMAGE_REF }}
        run: |
          set -euo pipefail
          [[ -n "$CANDIDATE_IMAGE_REF" ]] || { echo "RELEASE_BLOCKED: candidate immutable image reference missing"; exit 1; }
          docker pull "$CANDIDATE_IMAGE_REF"
          SOURCE_SHA="$(docker inspect "$CANDIDATE_IMAGE_REF" --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RELEASE_BLOCKED: container OCI source revision label missing or invalid: $SOURCE_SHA"; exit 1; }
          [[ "$SOURCE_SHA" == "$EXPECTED_RELEASE_SHA" ]] || { echo "RELEASE_BLOCKED: container OCI source SHA mismatch: expected=$EXPECTED_RELEASE_SHA actual=$SOURCE_SHA"; exit 1; }
          echo "CONTAINER_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Validate provenance certification prerequisites
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}
          CONTAINER_SOURCE_SHA: ${{ env.CONTAINER_SOURCE_SHA }}
          RELEASE_EVIDENCE_SIGNING_PRIVATE_KEY: ${{ secrets.KWAKOPOS_RELEASE_EVIDENCE_SIGNING_PRIVATE_KEY }}
          RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY: ${{ secrets.KWAKOPOS_RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY }}
          RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.KWAKOPOS_RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RELEASE_BLOCKED: invalid RELEASE_SHA"; exit 1; }
          [[ "$CONTAINER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RELEASE_BLOCKED: missing/invalid independently verified CONTAINER_SOURCE_SHA"; exit 1; }
          [[ "$RELEASE_SHA" == "$CONTAINER_SOURCE_SHA" ]] || { echo "RELEASE_BLOCKED: release/container provenance SHA mismatch"; exit 1; }
          [[ -n "$RELEASE_EVIDENCE_SIGNING_PRIVATE_KEY" ]] || { echo "RELEASE_BLOCKED: release evidence private signing key missing"; exit 1; }
          [[ -n "$RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY" ]] || { echo "RELEASE_BLOCKED: release evidence public signing key missing"; exit 1; }
          [[ "$RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY_FINGERPRINT" =~ ^([sS][hH][aA]256:)?[0-9a-fA-F]{64}$ ]] || { echo "RELEASE_BLOCKED: trusted signing public-key fingerprint missing or invalid"; exit 1; }

      - name: Run 15-Gate Version Sync Release Integrity Certification
        env:
          NODE_ENV: production-certification
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTIFICATION_SHA: ${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}
          CONTAINER_SOURCE_SHA: ${{ env.CONTAINER_SOURCE_SHA }}
          RELEASE_EVIDENCE_SIGNING_PRIVATE_KEY: ${{ secrets.KWAKOPOS_RELEASE_EVIDENCE_SIGNING_PRIVATE_KEY }}
          RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY: ${{ secrets.KWAKOPOS_RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY }}
          RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.KWAKOPOS_RELEASE_EVIDENCE_SIGNING_PUBLIC_KEY_FINGERPRINT }}
          KWAKOPOS_REQUIRED_CI_WORKFLOWS: ci.yml,security-scan.yml
        run: npm run certify:version-sync

      - name: Certify exact candidate over HTTPS
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npm run production:certify:deployed

      - name: Run Browser A → Cloud Run → Browser B certification
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npm run production:browser

      - name: Promote exact certified revision to 100 percent
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: kwakopos-production-service
          EXECUTE_GCLOUD: 'true'
        run: npm run release:promote

      - name: Publish official GitHub release and immutable tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/release/publish-github-release.ts

      - name: Execute production operations and governance gate
        env:
          NODE_ENV: production-certification
          STRICT_HTTPS: 'true'
        run: npx tsx scripts/ops/production-operations-gate.ts

      - name: Archive production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-exact-release-evidence-${{ github.event.client_payload.release_sha || inputs.release_sha || github.sha }}
          path: artifacts/release-evidence/
          retention-days: 90
          if-no-files-found: error
