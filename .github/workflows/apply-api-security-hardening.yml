name: Apply API Security Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'apply API security hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply centralized tenant and RBAC hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/api/src/server.ts')
          s = p.read_text()

          marker = 'function isProductionEnv(cfg: ReturnType<typeof loadConfig>) {\n  return cfg.NODE_ENV === "production" || cfg.NODE_ENV === "production-certification";\n}\n'
          helpers = marker + r'''

function requireTenantContext(req: FastifyRequest): TenantContext {
  if (!req.tenantContext) {
    throw new Error("UNAUTHORIZED: Authenticated tenant context is required");
  }
  return req.tenantContext;
}

function resolveTenantId(req: FastifyRequest, requestedTenantId?: unknown): string {
  const ctx = requireTenantContext(req);
  const requested = requestedTenantId == null ? "" : String(requestedTenantId).trim();
  if (requested && requested !== ctx.tenantId) {
    throw new Error("INVARIANT_007_VIOLATION: Cross-tenant access denied");
  }
  return ctx.tenantId;
}

function requireAdminContext(req: FastifyRequest): TenantContext {
  const ctx = requireTenantContext(req);
  const roles = Array.isArray(ctx.roles) ? ctx.roles.map((role) => String(role).toUpperCase()) : [];
  const permissions = Array.isArray(ctx.permissions) ? ctx.permissions.map((permission) => String(permission).toLowerCase()) : [];
  const isAdmin = roles.some((role) => ["ADMIN", "SUPER_ADMIN", "SUPERADMIN", "OWNER"].includes(role));
  const hasAdminPermission = permissions.includes("*") || permissions.some((permission) => permission === "admin:*" || permission.startsWith("admin:"));
  if (!isAdmin && !hasAdminPermission) {
    throw new Error("FORBIDDEN: Administrative privileges required");
  }
  return ctx;
}
'''
          if 'function requireTenantContext(req:' not in s:
              s = s.replace(marker, helpers, 1)

          # Admin endpoints must never bypass the authentication hook.
          s = s.replace('      url.startsWith("/admin/observability") ||\n', '')
          s = s.replace('      url.startsWith("/admin/releases") ||\n', '')
          s = s.replace('      url.startsWith("/admin/operations")\n', '')
          # Clean up dangling operators created by removal.
          s = s.replace('      url.startsWith("/telemetry") ||\n    )', '      url.startsWith("/telemetry")\n    )')
          s = s.replace('      url === "/auth/refresh" ||\n      url.startsWith("/telemetry")\n    )', '      url === "/auth/refresh" ||\n      url.startsWith("/telemetry")\n    )')

          # Compatibility aliases for API routes renamed during the merge.
          trace_marker = '    const url = req.routeOptions?.url || req.url.split("?")[0];\n'
          rewrite = '''    const url = req.routeOptions?.url || req.url.split("?")[0];
    if (req.url.startsWith("/api/v1/workforce/") && !req.url.startsWith("/api/v1/workforce-ops/")) {
      req.raw.url = req.url.replace("/api/v1/workforce/", "/api/v1/workforce-ops/");
    } else if (req.url === "/api/v1/commercial/portfolio") {
      req.raw.url = "/api/v1/commercial/summary";
    }
'''
          if 'req.raw.url = req.url.replace("/api/v1/workforce/"' not in s:
              s = s.replace(trace_marker, rewrite, 1)

          # Enforce admin RBAC after successful authentication and before routing completes.
          auth_end = '''    } catch (err: any) {
      return reply.status(401).send({ success: false, error: { code: "UNAUTHORIZED", message: err.message || "Invalid token" } });
    }
  });
'''
          auth_replacement = '''      const authenticatedPath = req.url.split("?")[0];
      if (authenticatedPath.startsWith("/admin/")) {
        requireAdminContext(req);
      }
    } catch (err: any) {
      const message = err?.message || "Invalid token";
      if (message.startsWith("FORBIDDEN")) {
        return reply.status(403).send({ success: false, error: { code: "FORBIDDEN", message } });
      }
      return reply.status(401).send({ success: false, error: { code: "UNAUTHORIZED", message } });
    }
  });
'''
          if 'const authenticatedPath = req.url.split("?")[0];' not in s:
              s = s.replace(auth_end, auth_replacement, 1)

          # Replace production-reachable synthetic tenant contexts.
          s = re.sub(r'const ctx = \(req as any\)\.tenantContext \|\| \{[^;]*?\};', 'const ctx = requireTenantContext(req);', s, flags=re.S)
          s = re.sub(r'const ctx = req\.tenantContext \|\| \{[^;]*?\};', 'const ctx = requireTenantContext(req);', s, flags=re.S)
          s = re.sub(r'const tenantId = \(req\.query as any\)\?\.tenantId \|\| "default-tenant";', 'const tenantId = resolveTenantId(req, (req.query as any)?.tenantId);', s)
          s = re.sub(r'body\.tenantId \|\| "TENANT-ENT-001"', 'resolveTenantId(req, body.tenantId)', s)
          s = re.sub(r'body\.tenantId \|\| "00000000-0000-0000-0000-000000000001"', 'resolveTenantId(req, body.tenantId)', s)

          # Re-add Telecom endpoints removed by the merge, using the existing service.
          telecom_marker = '  // Phase 18 — Enterprise Customer Onboarding (KEIF) Endpoints\n'
          telecom_routes = '''  // Telecom & Technical Services compatibility endpoints
  server.get("/api/v1/telecom/sites", async (req, reply) => {
    const { globalTelecomService } = await import("./services/telecomService.js");
    return reply.status(200).send({ success: true, data: globalTelecomService.getSites() });
  });

  server.get("/api/v1/telecom/assets", async (req, reply) => {
    const { globalTelecomService } = await import("./services/telecomService.js");
    return reply.status(200).send({ success: true, data: globalTelecomService.getAssets() });
  });

  server.get("/api/v1/telecom/work-orders", async (req, reply) => {
    const { globalTelecomService } = await import("./services/telecomService.js");
    return reply.status(200).send({ success: true, data: globalTelecomService.getWorkOrders() });
  });

  server.get("/api/v1/telecom/financial-summary", async (req, reply) => {
    const { globalTelecomService } = await import("./services/telecomService.js");
    return reply.status(200).send({ success: true, data: globalTelecomService.getFinancialSummary() });
  });

'''
          if 'server.get("/api/v1/telecom/sites"' not in s:
              s = s.replace(telecom_marker, telecom_routes + telecom_marker, 1)

          # Make health truthful about DB status instead of asserting connected.
          health_old = '  server.get("/health", async () => ({ status: "ok", timestamp: new Date().toISOString(), database: "connected" }));\n'
          health_new = '''  server.get("/health", async () => {
    let database: "connected" | "disconnected" | "not_configured" = "not_configured";
    if (productionPersistence) {
      try {
        const { prisma } = await import("@kwakopos2/database");
        await Promise.race([
          prisma.$queryRaw`SELECT 1`,
          new Promise((_, reject) => setTimeout(() => reject(new Error("DB health timeout")), 1500)),
        ]);
        database = "connected";
      } catch {
        database = "disconnected";
      }
    }
    return {
      status: database === "disconnected" ? "degraded" : "ok",
      timestamp: new Date().toISOString(),
      database,
    };
  });
'''
          if health_old in s:
              s = s.replace(health_old, health_new, 1)

          p.write_text(s)
          PY

      - name: Remove long-lived GCP service-account credential fallback from release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/production-release-certification.yml')
          s = p.read_text()
          s = s.replace('          credentials_json: ${{ secrets.GCP_SA_KEY }}\n', '')
          p.write_text(s)
          PY

      - name: Validate hardening changes
        run: |
          set -euo pipefail
          ! grep -nE 'tenantContext[[:space:]]*\|\|[[:space:]]*\{|body\.tenantId[[:space:]]*\|\|' apps/api/src/server.ts
          ! grep -n 'database: "connected"' apps/api/src/server.ts
          ! grep -n 'credentials_json:' .github/workflows/production-release-certification.yml
          npm run build
          npm run test:unit

      - name: Commit hardened API and release controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kwakoko Security Automation"
          git config user.email "security-automation@kwakopos.local"
          git add apps/api/src/server.ts .github/workflows/production-release-certification.yml .github/workflows/apply-api-security-hardening.yml
          git commit -m "fix(security): enforce tenant context and centralized admin RBAC" || exit 0
          git push origin HEAD:main

      - name: Disable one-time hardening workflow
        if: success()
        run: |
          echo "Hardening commit created. Workflow self-disables on the next push via commit-message guard."
