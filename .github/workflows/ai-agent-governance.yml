name: Kwakoko AI Agent Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-governance:
    name: AI Product-Agent Governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: AI Agent Governance Gate
        run: npm run ai-governance:verify
      - name: AI Governance Unit Contract
        run: npx vitest run tests/unit/ai-agent-governance.test.ts
      - name: Config Build
        run: npm --workspace=@kwakopos2/config run build
