name: Kwakoko Governance & Domain Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kwakopos-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance, Compliance & Domain Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Core product governance
        run: |
          npm run brand:verify
          npm run design:verify
          npm run experience:verify
          npm run workflow:verify

      - name: Security, privacy and lifecycle governance
        run: |
          npm run security-trust:verify
          npm run privacy-data:verify
          npm run lifecycle-dr:verify

      - name: AI and autonomous operations governance
        run: |
          npm run ai-governance:verify
          npm run ai-operating:verify
          npm run autonomous-operations:verify

      - name: Platform, commercial and reliability governance
        run: |
          npm run platform-governance:verify
          npm run commercial-readiness:verify
          npm run enterprise-readiness:verify
          npm run performance-scale:verify
          npx tsx scripts/release/verify-production-reliability.ts
          npm run production:evidence:verify

      - name: Integration, marketplace and analytics governance
        run: |
          npm run integration-api:verify
          npm run marketplace-partner:verify
          npm run bi-analytics:verify

      - name: Targeted governance tests
        run: |
          npx vitest run             tests/unit/brand-asset-lock.test.ts             tests/unit/ai-agent-governance.test.ts             tests/unit/ai-operating-layer-governance.test.ts             tests/unit/ai-operating-layer.test.ts             tests/unit/autonomous-operations-governance.test.ts             tests/unit/autonomous-operations.test.ts             tests/unit/bi-analytics-governance.test.ts             tests/unit/bi-analytics.test.ts             tests/unit/data-lifecycle-dr-governance.test.ts             tests/unit/privacy-data-governance.test.ts             tests/unit/security-trust-governance.test.ts             tests/unit/commercial-product-readiness-governance.test.ts             tests/unit/monetization-acceptance.test.ts             tests/unit/monetization-invariants.test.ts             tests/unit/enterprise-customer-readiness-governance.test.ts             tests/unit/enterprise-onboarding.test.ts             tests/unit/enterprise-approvals.test.ts             tests/unit/phase46-hardening.test.ts             tests/unit/integration-api-ecosystem-governance.test.ts             tests/unit/marketplace-partner-governance.test.ts             tests/unit/marketplace.test.ts             tests/unit/partner-ecosystem.test.ts             tests/unit/performance-scale-governance.test.ts             tests/unit/production-reliability-governance.test.ts             tests/unit/platform-governance-control-plane.test.ts             tests/unit/platform-governance.test.ts             tests/unit/super-admin-platform.test.ts             tests/unit/snapshot-reconciliation.test.ts             tests/unit/receipt-management-module.test.ts             tests/unit/production-api-repository-authority.test.ts

      - name: Inventory authority assertions
        run: |
          grep -q "currentTenantId, currentBranchId" apps/web/src/pages/InventoryPage.tsx
          grep -q "Stock Changes Use Stock Ledger" apps/web/src/pages/InventoryPage.tsx
          grep -q "executeAtomicMutation" apps/web/src/services/inventoryStockService.ts
          grep -q 'warehouseId: req.warehouseId' packages/database/src/prismaRepositories.ts
          grep -q "server snapshot may contain concurrent remote movements" apps/web/src/clientSyncEngine.ts

      - name: Governance summary
        if: always()
        run: |
          echo "Governance status: ${{ job.status }}"
          echo "Commit: $(git rev-parse HEAD)"
