name: World-Standard Offline Sync Gate

on:
  push:
    branches: [main, 'fix/world-standard-offline-sync-*']
  pull_request:
    branches: [main]

jobs:
  offline-sync-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run certify:offline-sync
      - run: npm run build
      - run: npm run test:sync
