name: Kwakoko Advanced Analytics & BI Governance
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  bi-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bi-analytics:verify
      - run: npx vitest run tests/unit/bi-analytics-governance.test.ts tests/unit/bi-analytics.test.ts
