name: One-Time Build Duplicate Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate attributes property
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/database/src/index.ts')
          s = p.read_text()
          old = '''        imageUrl: null,\n        attributes: {},\n        isActive: true,'''
          new = '''        imageUrl: null,\n        isActive: true,'''
          if old not in s:
              raise SystemExit('expected duplicate attributes property was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/repair-build-duplicate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/index.ts .github/workflows/repair-build-duplicate.yml
          git commit -m 'fix: remove duplicate variant attributes property'
          git push origin HEAD:main
