name: Scheduled Maintenance & Health Reports

on:
  # Scheduled health checks only; PR/main validation belongs to ci.yml.
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: scheduled-maintenance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-build-and-health:
    name: Build, Test & Health Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npx tsx scripts/release/health-check-gate.ts
