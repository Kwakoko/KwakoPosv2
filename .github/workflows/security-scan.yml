name: Security & Vulnerability Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  security-audit:
    name: Dependency Audit & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kwakopos_security_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kwakopos_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos_security_ci?schema=public
      CI: true
      NODE_ENV: test
      KWAKOPOS_TEST_BYPASS_LEGAL_GATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Start local API for executable security acceptance tests
        shell: bash
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          JWT_SECRET: "ci-security-local-only-not-for-production"
          START_SERVER: "true"
          SYNC_CERTIFICATION_PRISMA: "true"
        run: |
          set -euo pipefail
          nohup npx tsx apps/api/src/serverFixed.ts > /tmp/kwakopos-security-api.log 2>&1 &
          echo $! > /tmp/kwakopos-security-api.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kwakopos-security-api.log
          exit 1
      - name: Security certification
        env:
          KWAKOPOS_SECURITY_TARGET_URL: "http://127.0.0.1:3000"
        run: npm run certify:security
      - name: Stop local API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/kwakopos-security-api.pid ]]; then
            kill "$(cat /tmp/kwakopos-security-api.pid)" 2>/dev/null || true
          fi
          pkill -P "$(cat /tmp/kwakopos-security-api.pid 2>/dev/null)" 2>/dev/null || true
