name: Kwakoko Enterprise Customer Readiness Governance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enterprise-readiness:
    name: Enterprise Customer Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Enterprise Customer Readiness Governance
        run: npx tsx scripts/release/verify-enterprise-customer-readiness.ts
      - name: Enterprise Governance Tests
        run: npx vitest run tests/unit/enterprise-customer-readiness-governance.test.ts tests/unit/enterprise-onboarding.test.ts tests/unit/enterprise-approvals.test.ts
      - name: Support Operations Regression
        run: npx vitest run tests/unit/phase46-hardening.test.ts
      - name: Config Build
        run: npm --workspace=@kwakopos2/config run build
