# Firebase App Hosting Configuration for KwakoPos 2.0
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
  - variable: NODE_ENV
    value: "production"
    availability:
      - RUNTIME
  - variable: PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - RUNTIME
  - variable: SUPER_ADMIN_MFA_ENCRYPTION_KEY
    secret: SUPER_ADMIN_MFA_ENCRYPTION_KEY
    availability:
      - RUNTIME
